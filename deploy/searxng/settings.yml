# SearXNG configuration for Eika. The JSON format is required: the harness
# queries this instance over HTTP and parses the results.
use_default_settings: true

general:
  instance_name: "Eika Search"
  debug: false
  # No public instance, so no need to advertise metrics or donation links.
  enable_metrics: false

server:
  secret_key: "" # Supplied by SEARXNG_SECRET in the environment.
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: arxiv
    disabled: false
  - name: hackernews
    disabled: false
  - name: mdn
    disabled: false
  - name: pypi
    disabled: false
  - name: npm
    disabled: false
  - name: go packages
    disabled: false
