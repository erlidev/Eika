name: eika

services:
  eika:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eika:latest
    restart: unless-stopped
    environment:
      EIKA_LISTEN: ":8080"
      EIKA_DATABASE_URL: "postgres://${POSTGRES_USER:-eika}:${POSTGRES_PASSWORD:-eika}@postgres:5432/${POSTGRES_DB:-eika}?sslmode=disable"
      EIKA_DOCKER_SOCKET: "/var/run/docker.sock"
      EIKA_SEARXNG_URL: "http://searxng:8080"
      EIKA_SANDBOX_IMAGE: "${EIKA_SANDBOX_IMAGE:-eika-sandbox:latest}"
      EIKA_AUTH_TOKEN: "${EIKA_AUTH_TOKEN:?set EIKA_AUTH_TOKEN in deploy/.env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "${EIKA_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - eika-hub:/var/lib/eika
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-eika}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-eika}"
      POSTGRES_DB: "${POSTGRES_DB:-eika}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eika-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eika} -d ${POSTGRES_DB:-eika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/.env}"
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  eika-postgres:
  eika-hub:
