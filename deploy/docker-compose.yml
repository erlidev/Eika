name: eika

services:
  eika:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DOCKER_GID: "${DOCKER_GID:-999}"
    image: eika:latest
    restart: unless-stopped
    environment:
      EIKA_LISTEN: ":8080"
      EIKA_DATABASE_URL: "postgres://${POSTGRES_USER:-eika}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-eika}?sslmode=disable"
      EIKA_DOCKER_SOCKET: "/var/run/docker.sock"
      EIKA_SEARXNG_URL: "http://searxng:8080"
      EIKA_SANDBOX_IMAGE: "${EIKA_SANDBOX_IMAGE:-eika-sandbox:latest}"
      # Sandboxes join this network, which is how the harness reaches them by
      # container name and how they reach the git hub at EIKA_HUB_URL.
      EIKA_SANDBOX_NETWORK: "eika_default"
      EIKA_EIKAD_BINARY: "/usr/local/share/eika/eikad"
      EIKA_HUB_ROOT: "/var/lib/eika/hub"
      EIKA_HUB_URL: "http://eika:8080"
      EIKA_AUTH_TOKEN: "${EIKA_AUTH_TOKEN:?set EIKA_AUTH_TOKEN in deploy/.env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "127.0.0.1:${EIKA_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - eika-hub:/var/lib/eika
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-eika}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:-eika}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eika-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eika} -d ${POSTGRES_DB:-eika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/.env}"
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  eika-postgres:
  eika-hub:

# The name is pinned because sandbox containers are started by the harness
# rather than by compose, and they join this network by name.
networks:
  default:
    name: eika_default
