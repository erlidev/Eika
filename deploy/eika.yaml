# Default Eika configuration. Secrets are not set here; supply them through
# the EIKA_* environment variables documented in deploy/.env.example.
listen: ":8080"
database_url: "postgres://eika:eika@postgres:5432/eika?sslmode=disable"
docker_socket: "/var/run/docker.sock"
searxng_url: "http://searxng:8080"
sandbox_image: "eika-sandbox:latest"
# Sandboxes join this network so the harness reaches them by container name.
# It is deliberately not the default network: postgres and searxng are not on
# it. Leave it empty to publish each sandbox's daemon port on 127.0.0.1
# instead, which is what a harness running outside compose needs.
sandbox_network: "eika_sandbox"
eikad_binary: "/usr/local/share/eika/eikad"
hub_root: "/var/lib/eika/hub"
# The address a sandbox uses to reach the git hub, which the harness serves at
# /git on this address.
hub_url: "http://eika:8080"

models:
  - name: gpt-5
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 400000
    max_output: 128000
