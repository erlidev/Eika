- dialog "This session's configuration":
  - heading "This session's configuration" [level=2]
  - paragraph: The profile the session runs with, and what it sets for itself over it. A change applies from the next message.
  - text: Profile
  - button "Edit the profile"
  - combobox "Profile": Reviewer
  - paragraph: /~\d+ tokens every request sends before the conversation, not counting context files/
  - button /System prompt ~\d+/
  - button /Tools ~\d+/
  - tablist "Settings":
    - tab "Model" [selected]
    - tab "Prompt"
    - tab "Tools"
    - tab "Sampling"
  - tabpanel "Model":
    - text: Model default
    - combobox "Model": gpt-5, from the default
    - term: Endpoint id
    - definition: gpt-5
    - term: Context window
    - definition: /[\d,.]+[bkmBKM]+/
    - term: Max output
    - definition: /[\d,.]+[bkmBKM]+/
    - text: Max output tokens from the model
    - textbox "Max output tokens":
      - /placeholder: "128000"
    - paragraph: The most a single answer may be; at least 1.
    - text: Reasoning effort from the model
    - radiogroup "Reasoning effort":
      - radio "low"
      - radio "medium"
      - radio "high"
    - paragraph: How long the model thinks before it answers.
    - text: Preserve thinking from the model
    - radiogroup "Preserve thinking":
      - radio "Replay"
      - radio "Leave out"
    - paragraph: "Send the model's earlier reasoning back with the conversation. It costs context; some models reason better across turns with it. Not set here: leave out, from the model."
  - button "Cancel"
  - button "Save"
  - button "Close"