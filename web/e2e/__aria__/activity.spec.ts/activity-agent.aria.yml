- main:
  - navigation "Subagents":
    - group "Project":
      - button "All" [pressed]
      - button "Garden"
      - button "Kitchen"
    - region "Waiting":
      - heading "Waiting" [level=2]
      - list:
        - listitem:
          - 'link /Waiting: quotes worker [\d,.]+[bkmBKM]+ ago Waiting on a slow bash call, running for 4 minutes/':
            - /url: /activity/subagent-quotes
        - listitem:
          - 'link /Waiting: permit researcher · Kitchen [\d,.]+[bkmBKM]+ ago Waiting on the user''s answer about which council applies/':
            - /url: /activity/subagent-permit
    - region "Running":
      - heading "Running" [level=2]
      - list:
        - listitem:
          - 'link /Running: plumber researcher · Kitchen [\d,.]+[bkmBKM]+ ago Find a plumber\./':
            - /url: /activity/subagent-plumber
    - region "Idle":
      - heading "Idle" [level=2]
      - list:
        - listitem:
          - 'link /Idle: repair worker · Kitchen [\d,.]+[bkmBKM]+ ago The repair is complete\./':
            - /url: /activity/subagent-repair
        - listitem:
          - 'link /Idle: seedlings researcher · Garden \d+[hmsp]+ ago Three varieties suit a cold greenhouse: Latah, Stupice and Siberian\./':
            - /url: /activity/subagent-seedlings
    - region "Failed and cancelled":
      - heading "Failed and cancelled" [level=2]
      - list:
        - listitem:
          - 'link /Failed: tiling worker · Kitchen \d+[hmsp]+ ago Measure the splashback and list the tiles it needs\./':
            - /url: /activity/subagent-tiling
        - listitem:
          - 'link /Cancelled: paint researcher · Garden \d+[hmsp]+ ago Compare fence paints\./':
            - /url: /activity/subagent-paint
