- region "Part detail":
  - heading "Parameters" [level=3]
  - paragraph: What the request sends beside its content, and the layer each came from.
  - table:
    - rowgroup:
      - row "Parameter Value From Edit":
        - columnheader "Parameter"
        - columnheader "Value"
        - columnheader "From"
        - columnheader "Edit"
    - rowgroup:
      - row "model gpt-5 default":
        - cell "model"
        - cell "gpt-5"
        - cell "default"
        - cell
      - row /max_output \d+ from the model/:
        - cell "max_output"
        - cell /\d+/
        - cell "from the model"
        - cell
      - row "reasoning_effort medium from the model":
        - cell "reasoning_effort"
        - cell "medium"
        - cell "from the model"
        - cell
      - row "temperature 0.7 from the session":
        - cell "temperature"
        - cell "0.7"
        - cell "from the session"
        - cell
      - row "thinking_switch reasoning_effort from the model":
        - cell "thinking_switch"
        - cell "reasoning_effort"
        - cell "from the model"
        - cell
      - row "preserve_thinking false from the model":
        - cell "preserve_thinking"
        - cell "false"
        - cell "from the model"
        - cell