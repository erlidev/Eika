# CI runs what `make check` runs, split into jobs so a failure names its part:
# the Go checks, the web checks, and the visual suite against the mock
# harness. Tests tagged `docker` are not run here; they need a Docker socket.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          unsorted=$(go tool goimports -l cmd internal)
          if [ -n "$unsorted" ]; then echo "goimports needed:"; echo "$unsorted"; exit 1; fi
      - name: Lint
        run: make lint-go
      - name: Test
        run: make test-go

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - name: Format
        run: cd web && npm run format:check
      - name: Lint
        run: make lint-web
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test-web

  visual:
    name: Visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compare the screens with their baselines
        run: make visual PLAYWRIGHT_DEPS=--with-deps
      - name: Upload the report and the diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/e2e/report
            web/e2e/test-results
          retention-days: 14
