# Used by `make lint` when golangci-lint is installed. `make check` does not
# depend on it: go vet and staticcheck run through `go tool` and are always
# available.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    # An unchecked Close, Flush, or print is deliberate: the work is done or
    # already failed, and the error would say nothing a caller can act on.
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
